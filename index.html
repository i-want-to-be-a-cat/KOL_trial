<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="完成八道电影审美选择题，找到与你灵魂同频的电影。">
<meta name="theme-color" content="#1a1715">
<meta property="og:title" content="光影人格 · 你与哪部电影同频">
<meta property="og:description" content="八道题，二十四种选择，一部与你灵魂同频的电影。">
<meta property="og:type" content="website">
<title>光影人格 · 你与哪部电影同频</title>
<style>
  @import url('https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Ma+Shan+Zheng&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1715;
    --bg-2: #25201c;
    --ink: #e8ddd0;
    --ink-soft: #b8a998;
    --accent: #c9a76c;
    --accent-2: #8a6a3f;
    --line: rgba(201, 167, 108, 0.2);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(201,167,108,0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(138,106,63,0.08) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(232,221,208,0.015) 2px, rgba(232,221,208,0.015) 4px);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .screen {
    width: 100%;
    max-width: 680px;
    animation: fadeUp 0.8s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none !important; }

  /* ───────── START ───────── */
  .start-wrap {
    text-align: center;
    padding: 20px 0;
  }

  .start-eyebrow {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 14px;
    letter-spacing: 0.5em;
    color: var(--accent);
    margin-bottom: 32px;
    padding-left: 0.5em;
  }

  .start-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: clamp(42px, 8vw, 68px);
    font-weight: 400;
    line-height: 1.3;
    color: var(--ink);
    margin-bottom: 16px;
    letter-spacing: 0.08em;
  }

  .start-title .accent {
    color: var(--accent);
  }

  .start-sub {
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 2;
    margin: 36px 0 56px;
    letter-spacing: 0.1em;
  }

  .start-sub .sep {
    display: inline-block;
    margin: 0 14px;
    color: var(--accent);
    opacity: 0.6;
  }

  .film-strip {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 48px 0;
  }

  .film-strip span {
    width: 8px;
    height: 8px;
    background: var(--accent);
    opacity: 0.3;
    border-radius: 1px;
  }
  .film-strip span:nth-child(odd)  { height: 20px; }
  .film-strip span:nth-child(even) { align-self: center; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 44px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--accent);
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    letter-spacing: 0.3em;
    padding-left: calc(44px + 0.3em);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: translateX(-101%);
    transition: transform 0.4s ease;
    z-index: -1;
  }

  .btn:hover {
    color: var(--bg);
    border-color: var(--accent);
  }
  .btn:hover::before {
    transform: translateX(0);
  }

  .btn:focus-visible,
  .option:focus-visible,
  .btn-ghost:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  .btn .arrow {
    font-size: 18px;
    color: var(--accent);
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .btn:hover .arrow { color: var(--bg); transform: translateX(4px); }

  .start-hint {
    margin-top: 64px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.3em;
    opacity: 0.5;
  }

  /* ───────── QUIZ ───────── */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 48px;
    padding-top: 8px;
  }

  .progress-track {
    flex: 1;
    height: 1px;
    background: var(--line);
    position: relative;
    margin: 0 24px;
  }

  .progress-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--accent);
    transition: width 0.5s ease;
  }

  .progress-num {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: 0.1em;
    min-width: 60px;
  }
  .progress-num.right { text-align: right; }

  .q-wrap {
    padding: 20px 0 10px;
  }

  .q-eyebrow {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.4em;
    margin-bottom: 24px;
    padding-left: 0.4em;
    opacity: 0.8;
  }

  .q-text {
    font-size: clamp(22px, 4vw, 30px);
    line-height: 1.9;
    font-weight: 400;
    margin-bottom: 52px;
    color: var(--ink);
    letter-spacing: 0.05em;
  }

  .q-text .quote-mark {
    color: var(--accent);
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 1.2em;
    opacity: 0.6;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 22px 28px 22px 64px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    line-height: 1.8;
    letter-spacing: 0.05em;
    cursor: pointer;
    position: relative;
    transition: all 0.35s ease;
  }

  .option .opt-label {
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 20px;
    color: var(--accent);
    opacity: 0.7;
    transition: all 0.35s ease;
  }

  .option:hover {
    border-color: var(--accent);
    background: rgba(201, 167, 108, 0.04);
    transform: translateX(4px);
  }
  .option:hover .opt-label {
    opacity: 1;
    color: var(--ink);
  }

  .option.selected {
    border-color: var(--accent);
    background: rgba(201, 167, 108, 0.08);
  }
  .option.selected .opt-label {
    opacity: 1;
    color: var(--ink);
  }

  .nav-row {
    margin-top: 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .btn-ghost {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    letter-spacing: 0.25em;
    padding: 12px 8px;
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .btn-ghost:hover { color: var(--accent); }
  .btn-ghost:disabled { opacity: 0.25; cursor: not-allowed; }
  .btn-ghost:disabled:hover { color: var(--ink-soft); }

  .btn-next {
    padding: 12px 32px 12px calc(32px + 0.25em);
    font-size: 14px;
    letter-spacing: 0.25em;
  }

  /* ───────── RESULT ───────── */
  .result-eyebrow {
    text-align: center;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.5em;
    padding-left: 0.5em;
    margin-bottom: 40px;
    opacity: 0.8;
  }

  .result-card {
    border: 1px solid var(--line);
    padding: 56px 48px 48px;
    background: linear-gradient(180deg, rgba(201,167,108,0.02) 0%, transparent 100%);
    position: relative;
    margin-bottom: 40px;
  }

  .result-card::before,
  .result-card::after {
    content: '';
    position: absolute;
    width: 40px; height: 40px;
    border: 1px solid var(--accent);
    opacity: 0.5;
  }
  .result-card::before { top: 16px; left: 16px; border-right: none; border-bottom: none; }
  .result-card::after  { bottom: 16px; right: 16px; border-left: none; border-top: none; }

  .director-label {
    font-size: 12px;
    letter-spacing: 0.4em;
    color: var(--ink-soft);
    margin-bottom: 16px;
    padding-left: 0.4em;
  }

  .director-name {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: clamp(36px, 7vw, 56px);
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
  }

  .film-name {
    font-size: clamp(20px, 3.5vw, 28px);
    color: var(--ink);
    margin-bottom: 32px;
    letter-spacing: 0.1em;
    font-weight: 400;
  }

  .film-name .year {
    font-size: 0.6em;
    color: var(--ink-soft);
    margin-left: 12px;
    font-weight: 300;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--accent);
    opacity: 0.4;
    margin: 0 auto 32px;
  }

  .quote {
    font-size: 17px;
    line-height: 2.1;
    color: var(--ink);
    font-style: italic;
    text-align: center;
    margin-bottom: 36px;
    letter-spacing: 0.06em;
    position: relative;
    padding: 0 20px;
  }
  .quote::before {
    content: '「';
    position: absolute;
    left: -4px;
    top: -8px;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 28px;
    color: var(--accent);
    opacity: 0.5;
    font-style: normal;
  }
  .quote::after {
    content: '」';
    position: absolute;
    right: -4px;
    bottom: -8px;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 28px;
    color: var(--accent);
    opacity: 0.5;
    font-style: normal;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 40px;
  }

  .tag {
    padding: 6px 16px;
    border: 1px solid var(--line);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    background: rgba(201,167,108,0.02);
  }

  .section-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 20px;
    color: var(--accent);
    margin: 36px 0 20px;
    letter-spacing: 0.2em;
    padding-left: 0.2em;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 20px;
    background: var(--accent);
    opacity: 0.7;
  }

  .analysis-text {
    font-size: 15px;
    line-height: 2.1;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    margin-bottom: 24px;
  }
  .analysis-text strong {
    color: var(--ink);
    font-weight: 500;
  }

  .reason-list {
    list-style: none;
    padding: 0;
    margin-top: 8px;
  }
  .reason-list li {
    padding: 14px 0 14px 32px;
    font-size: 14px;
    line-height: 2;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    letter-spacing: 0.03em;
    position: relative;
  }
  .reason-list li:last-child { border-bottom: none; }
  .reason-list li::before {
    content: '◇';
    position: absolute;
    left: 6px;
    top: 14px;
    color: var(--accent);
    font-size: 12px;
    opacity: 0.8;
  }
  .reason-list li strong {
    color: var(--ink);
    font-weight: 500;
  }

  .retake-wrap {
    text-align: center;
    padding: 32px 0 20px;
  }

  @media (max-width: 520px) {
    .result-card { padding: 40px 24px 32px; }
    .q-text { margin-bottom: 36px; }
    .option { padding: 18px 20px 18px 52px; font-size: 15px; }
    .option .opt-label { left: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ═══════════ START ═══════════ -->
  <div id="screen-start" class="screen">
    <div class="start-wrap">
      <div class="start-eyebrow">光影人格测试</div>
      <h1 class="start-title">你与哪部电影<br><span class="accent">灵魂同频</span></h1>
      <div class="film-strip">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="start-sub">
        八道题 <span class="sep">·</span> 二十四种选择 <span class="sep">·</span> 一部你的电影
      </p>
      <button class="btn" onclick="startQuiz()">
        开始放映 <span class="arrow">→</span>
      </button>
      <p class="start-hint">请凭直觉作答 ／ 无对错之分</p>
    </div>
  </div>

  <!-- ═══════════ QUIZ ═══════════ -->
  <div id="screen-quiz" class="screen hidden">
    <div class="quiz-header">
      <div class="progress-num" id="pNum">01</div>
      <div class="progress-track"><div class="progress-bar" id="pBar" style="width:0%"></div></div>
      <div class="progress-num right">08</div>
    </div>

    <div class="q-wrap">
      <div class="q-eyebrow" id="qEyebrow">第 一 幕</div>
      <h2 class="q-text" id="qText"></h2>
      <div class="options" id="optBox"></div>
    </div>

    <div class="nav-row">
      <button class="btn-ghost" id="prevBtn" onclick="prevQ()" disabled>← 上一题</button>
      <button class="btn btn-next" id="nextBtn" onclick="nextQ()">
        下一题 <span class="arrow">→</span>
      </button>
    </div>
  </div>

  <!-- ═══════════ RESULT ═══════════ -->
  <div id="screen-result" class="screen hidden">
    <div class="result-eyebrow">· 你 的 影 像 答 案 ·</div>

    <div class="result-card">
      <div class="director-label">D I R E C T O R</div>
      <div class="director-name" id="rDirector"></div>
      <h3 class="film-name"><span id="rFilm"></span><span class="year" id="rYear"></span></h3>

      <div class="divider"></div>
      <div class="quote" id="rQuote"></div>

      <div class="tags" id="rTags"></div>

      <div class="section-title">风 格 解 析</div>
      <div class="analysis-text" id="rAnalysis"></div>

      <div class="section-title">为 什 么 是 它</div>
      <ul class="reason-list" id="rReasons"></ul>
    </div>

    <div class="retake-wrap">
      <button class="btn" onclick="retake()">
        再 测 一 次 <span class="arrow">↻</span>
      </button>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════
   问题库 · 每个选项对应维度得分
   维度: 【慢/静】【冷/疏离】【暖/治愈】【荒诞/黑色】
        【奇/魔幻】【暴/激烈】【诗/意象】【悬/思辨】
   ══════════════════════════════════════════════════ */
const questions = [
  {
    eyebrow: "第 一 幕",
    q: "如果人生是一场电影，你希望它的开场是：",
    opts: [
      { t: "空镜头：清晨的街道，雾气未散，只有扫地声", s: {慢:3,诗:2,暖:1} },
      { t: "近景：一双鞋匆匆踏过积水，远处传来警笛", s: {暴:2,悬:3,冷:1} },
      { t: "长镜头：一场荒诞的婚礼，所有人都在笑着哭", s: {荒诞:3,暖:1,奇:1} }
    ]
  },
  {
    eyebrow: "第 二 幕",
    q: "你最喜欢的电影色调是：",
    opts: [
      { t: "褪了色的暖黄，像老照片那样温柔", s: {暖:3,诗:2,慢:1} },
      { t: "清冷的蓝与灰，雨夜里霓虹灯的倒影", s: {冷:3,悬:2,诗:1} },
      { t: "浓烈的撞色，红的血、绿的草、艳的裙", s: {暴:2,奇:2,荒诞:2} }
    ]
  },
  {
    eyebrow: "第 三 幕",
    q: "走进一家深夜食堂，你点了：",
    opts: [
      { t: "一碗热汤面，老板娘不问来处", s: {暖:3,慢:2,诗:1} },
      { t: "一杯威士忌，坐在角落观察每一个人", s: {冷:2,悬:3,荒诞:1} },
      { t: "什么都不点，只来抽根烟，然后消失在巷口", s: {冷:2,暴:1,诗:2,悬:1} }
    ]
  },
  {
    eyebrow: "第 四 幕",
    q: "你更喜欢的叙事节奏是：",
    opts: [
      { t: "慢，像日子在一页页翻，什么都不说但什么都在", s: {慢:3,诗:3,暖:1} },
      { t: "跳跃，时空交错，像回忆和现实在打架", s: {悬:2,奇:2,冷:1,诗:1} },
      { t: "一路狂奔，不知道下一秒会发生什么", s: {暴:3,悬:2,荒诞:1} }
    ]
  },
  {
    eyebrow: "第 五 幕",
    q: "故事的结尾，你希望那个人：",
    opts: [
      { t: "回到了家，桌上的灯还亮着", s: {暖:3,慢:2,诗:1} },
      { t: "独自上路，消失在公路的尽头", s: {冷:3,诗:2,慢:1} },
      { t: "笑着死去，在最灿烂的一瞬间", s: {暴:2,荒诞:2,奇:2,诗:1} }
    ]
  },
  {
    eyebrow: "第 六 幕",
    q: "如果要选一件道具贯穿全片：",
    opts: [
      { t: "一本写满了字的旧日记本", s: {诗:3,慢:2,暖:1} },
      { t: "一把没装子弹的手枪", s: {悬:2,暴:2,荒诞:2,冷:1} },
      { t: "一罐过期的凤梨罐头", s: {荒诞:3,暖:1,诗:2,冷:1} }
    ]
  },
  {
    eyebrow: "第 七 幕",
    q: "你最想经历的一场戏：",
    opts: [
      { t: "在田野里奔跑，风穿过耳朵，没有人说话", s: {诗:3,暖:2,慢:2} },
      { t: "雨夜的复仇，刀与伞，分不清雨和血", s: {暴:3,冷:2,悬:2} },
      { t: "一场永远停不下来的梦，梦里全是从前的人", s: {奇:3,诗:2,暖:1,冷:1} }
    ]
  },
  {
    eyebrow: "第 八 幕",
    q: "散场灯亮时，你希望观众心里留下的是：",
    opts: [
      { t: "淡淡的温柔，想给家里打个电话", s: {暖:3,诗:2,慢:2} },
      { t: "深深的沉默，很久说不出一句话", s: {冷:3,诗:2,悬:1,慢:1} },
      { t: "心跳加速，想在大街上狂奔一圈", s: {暴:2,荒诞:2,悬:2,奇:1} }
    ]
  }
];

/* ══════════════════════════════════════════════════
   结果库 · 豆瓣TOP250 + 园子温等小众导演
   ══════════════════════════════════════════════════ */
const results = [

/* ══════════════════════════════════════════════════
   状态
   ══════════════════════════════════════════════════ */
let current = 0;
let answers = new Array(questions.length).fill(null); // 存 index 0/1/2

/* ══════════════════════════════════════════════════
   渲染问题
   ══════════════════════════════════════════════════ */
function renderQ() {
  const q = questions[current];
  document.getElementById('pNum').textContent = String(current+1).padStart(2,'0');
  document.getElementById('pBar').style.width = ((current)/questions.length*100)+'%';
  document.getElementById('qEyebrow').textContent = q.eyebrow;
  document.getElementById('qText').innerHTML =
    `<span class="quote-mark">「</span>${q.q}<span class="quote-mark">」</span>`;

  const optBox = document.getElementById('optBox');
  optBox.innerHTML = '';
  q.opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    if (answers[current] === i) btn.classList.add('selected');
    btn.innerHTML = `<span class="opt-label">${String.fromCharCode(65+i)}</span>${o.t}`;
    btn.onclick = () => {
      answers[current] = i;
      document.querySelectorAll('.option').forEach(e=>e.classList.remove('selected'));
      btn.classList.add('selected');
    };
    optBox.appendChild(btn);
  });

  document.getElementById('prevBtn').disabled = current === 0;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.querySelector('.arrow').previousSibling.textContent =
    current === questions.length - 1 ? '揭晓答案 ' : '下一题 ';
}

function startQuiz() {
  current = 0;
  answers = new Array(questions.length).fill(null);
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  renderQ();
}

function nextQ() {
  if (answers[current] === null) {
    // 轻抖提示
    const box = document.getElementById('optBox');
    box.style.transition = 'none';
    box.style.transform = 'translateX(-4px)';
    requestAnimationFrame(()=>{
      box.style.transition = 'transform 0.3s';
      box.style.transform = '';
    });
    return;
  }
  if (current < questions.length - 1) {
    current++;
    renderQ();
  } else {
    showResult();
  }
}

function prevQ() {
  if (current > 0) { current--; renderQ(); }
}

/* ══════════════════════════════════════════════════
   核心匹配算法
   ══════════════════════════════════════════════════ */
function computeScores() {
  const sum = {慢:0,诗:0,暖:0,冷:0,荒诞:0,奇:0,暴:0,悬:0};
  answers.forEach((ansIdx, i) => {
    const s = questions[i].opts[ansIdx].s;
    Object.keys(s).forEach(k => sum[k] += s[k]);
  });
  return sum;
}

function bestMatch(userScore) {
  // 余弦相似度 + 惩罚缺失维度
  let bestIdx = 0, bestScore = -Infinity;
  results.forEach((r, i) => {
    const p = r.profile;
    let dot = 0, normU = 0, normR = 0;
    Object.keys(userScore).forEach(k => {
      const u = userScore[k] || 0;
      const v = p[k] || 0;
      dot += u * v;
      normU += u * u;
      normR += v * v;
    });
    const cos = normU === 0 || normR === 0 ? 0 : dot / (Math.sqrt(normU) * Math.sqrt(normR));
    // 加权：让高维度的命中更重要
    let weighted = cos;
    const topUser = Object.entries(userScore).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
    topUser.forEach(k => {
      if ((p[k]||0) >= 5) weighted += 0.05;
    });
    if (weighted > bestScore) { bestScore = weighted; bestIdx = i; }
  });
  return bestIdx;
}

function showResult() {
  const userScore = computeScores();
  const idx = bestMatch(userScore);
  const r = results[idx];

  document.getElementById('screen-quiz').classList.add('hidden');
  const s = document.getElementById('screen-result');
  s.classList.remove('hidden');

  document.getElementById('rDirector').textContent = r.director;
  document.getElementById('rFilm').textContent = r.film;
  document.getElementById('rYear').textContent = '（' + r.year + '）';
  document.getElementById('rQuote').textContent = r.quote;
  document.getElementById('rAnalysis').textContent = r.analysis;

  const tags = document.getElementById('rTags');
  tags.innerHTML = '';
  r.tags.forEach(t => {
    const span = document.createElement('span');
    span.className = 'tag';
    span.textContent = t;
    tags.appendChild(span);
  });

  const ul = document.getElementById('rReasons');
  ul.innerHTML = '';
  r.reasons.forEach(html => {
    const li = document.createElement('li');
    li.innerHTML = html;
    ul.appendChild(li);
  });

  window.scrollTo({top:0, behavior:'smooth'});
}

function retake() {
  startQuiz();
}
